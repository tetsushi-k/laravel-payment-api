# =============================================================
# Nginx 設定ファイル
# PHPリクエストをPHP-FPM（appコンテナ）に転送する設定
# =============================================================

server {
    # -----------------------------------------------------------
    # ポート80でHTTPリクエストを待ち受ける
    # -----------------------------------------------------------
    listen 80;

    # -----------------------------------------------------------
    # サーバー名（ローカル開発環境なのでlocalhostを指定）
    # -----------------------------------------------------------
    server_name localhost;

    # -----------------------------------------------------------
    # Laravelのドキュメントルート
    # publicディレクトリを公開ルートにすることで、
    # アプリケーションの内部ファイルへの直接アクセスを防ぐ
    # （セキュリティ上重要な設計）
    # -----------------------------------------------------------
    root /var/www/public;
    index index.php index.html;

    # -----------------------------------------------------------
    # URLルーティング設定
    # 存在するファイル・ディレクトリは直接返し、
    # それ以外はすべて index.php（Laravel）に渡す
    # これによりLaravelのルーティングが機能する
    # -----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # -----------------------------------------------------------
    # PHPファイルのリクエスト処理
    # PHP-FPM（appコンテナ）にFastCGIで転送する
    # -----------------------------------------------------------
    location ~ \.php$ {
        # appコンテナの9000番ポート（PHP-FPMのデフォルト）に転送
        fastcgi_pass app:9000;
        fastcgi_index index.php;

        # PHPファイルの絶対パスをFastCGIに渡す
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # -----------------------------------------------------------
    # .htaccessなどの隠しファイルへのアクセスを禁止する
    # セキュリティ注意: .envファイルなどが外部から参照されないよう必須の設定
    # -----------------------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
